# ponytail: Supabase free pausa el proyecto tras 7 días sin actividad; un GET diario lo mantiene despierto.
# Ojo: GitHub desactiva los cron en repos sin commits por 60 días — si pasa, reactivarlo desde la pestaña Actions.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "$SUPABASE_URL/rest/v1/vinilos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
